<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTX 合约价格监控</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">🔔</span>
    <div>
      <h1>HTX 合约价格监控</h1>
      <div class="sub">自然语言一键设置 · USDT 本位永续 · 本地运行</div>
    </div>
  </div>
  <div class="statusbar">
    <span class="pill" id="pill-sse">界面 --</span>
    <span class="pill" id="pill-ws">WS --</span>
    <span class="pill" id="pill-rest">REST --</span>
    <span class="pill" id="pill-lat">延迟 --</span>
    <span class="pill" id="pill-cert">证书 --</span>
  </div>
</header>

<main>
  <section class="composer card">
    <label for="nl">用一句话描述你要监控的条件</label>
    <div class="row">
      <input id="nl" type="text" autocomplete="off" spellcheck="false"
             placeholder="例如：BTC 跌破 83000 提醒我">
      <button id="btn-add" class="primary">一键添加</button>
      <button id="btn-test" class="ghost" title="测试提醒通道">测试提醒</button>
    </div>
    <div class="chips" id="examples">
      <span class="chip">BTC 跌破 83000 提醒我</span>
      <span class="chip">ETH 5分钟涨2% 提醒</span>
      <span class="chip">SOL 突破 122.6 或 跌破 118.9</span>
      <span class="chip">比特币接近 90000 还有1%时提醒</span>
      <span class="chip">XMR 在 540 到 580 之间提醒</span>
      <span class="chip">ETH 每次跌1.5% 提醒我</span>
      <span class="chip">BTC 突破 83000-85000 区间</span>
    </div>
    <div id="parse-msg" class="parse-msg"></div>
  </section>

  <section class="grid">
    <div class="col">
      <div class="card">
        <h2>实时行情 <span class="hint" id="tick-src"></span></h2>
        <div id="tickers" class="tickers"></div>
        <div class="row small">
          <input id="sym-input" type="text" placeholder="添加合约，如 DOGE-USDT" size="22">
          <button id="btn-sym" class="ghost">加入监控</button>
        </div>
      </div>

      <div class="card">
        <h2>监控规则 <span class="hint" id="rule-count"></span>
          <button id="btn-clear-done" class="ghost right">清理已触发</button>
        </h2>
        <div id="rules" class="rules"></div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <h2>提醒记录</h2>
        <div id="events" class="events"></div>
      </div>

      <div class="card">
        <h2>设置</h2>
        <div class="settings">
          <label class="line"><input type="checkbox" id="cfg-ws"> 启用 WebSocket 实时推送（主通道）</label>
          <label class="line">REST 轮询间隔（秒）
            <input type="number" id="cfg-poll" min="1" max="60" step="0.5" style="width:80px">
          </label>
          <div class="sep"></div>
          <label class="line"><input type="checkbox" id="cfg-ui"> 界面提醒</label>
          <label class="line"><input type="checkbox" id="cfg-sound"> 声音提醒</label>
          <label class="line"><input type="checkbox" id="cfg-toast"> Windows 系统通知</label>
          <label class="line">Webhook
            <select id="cfg-hook-kind">
              <option value="generic">通用 JSON</option>
              <option value="wecom">企业微信</option>
              <option value="dingtalk">钉钉</option>
              <option value="feishu">飞书</option>
              <option value="serverchan">Server酱</option>
              <option value="telegram">Telegram</option>
            </select>
          </label>
          <input id="cfg-hook" type="text" placeholder="https://... 留空表示不启用">
          <div class="sep"></div>
          <label class="line"><input type="checkbox" id="cfg-llm"> 启用 LLM 兜底解析（本地规则看不懂时才调用）</label>
          <div class="row small">
            <input id="cfg-llm-url" type="text" placeholder="Base URL，如 https://api.openai.com/v1">
            <input id="cfg-llm-model" type="text" placeholder="模型，如 gpt-4o-mini" size="18">
          </div>
          <input id="cfg-llm-key" type="password" placeholder="API Key（保存在本机 config.json）">
          <div class="row">
            <button id="btn-save" class="primary">保存设置</button>
            <button id="btn-notify-perm" class="ghost">开启浏览器通知</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
<div id="toast-wrap"></div>
<script src="/app.js"></script>
</body>
</html>
